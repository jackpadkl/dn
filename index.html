  <style>
    :root {
      --bg: #07100d;
      --bg-soft: #0b1713;
      --green: #0d211a;
      --green-light: #15372b;
      --cream: #f3eee3;
      --muted: #a9afa9;
      --line: rgba(243, 238, 227, 0.14);
      --gold: #c9b38a;
      --gold-light: #e2d2b0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 72% 30%,
          rgba(31, 82, 62, 0.26),
          transparent 32%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(24, 62, 47, 0.18),
          transparent 30%
        ),
        var(--bg);
      color: var(--cream);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      z-index: 10;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .page {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: relative;
      z-index: 5;
      width: 100%;
      padding: 30px 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--cream);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      border: 1px solid rgba(243, 238, 227, 0.7);
      display: grid;
      place-items: center;
      transform: rotate(45deg);
    }

    .brand-mark span {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(-45deg);
    }

    .header-label {
      color: rgba(243, 238, 227, 0.48);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .hero {
      flex: 1;
      min-height: calc(100vh - 88px);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(380px, 0.95fr);
      align-items: center;
      gap: 5vw;
      padding: 40px 7vw 80px;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      max-width: 720px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 27px;
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      max-width: 720px;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: clamp(58px, 7.5vw, 112px);
      font-weight: 400;
      line-height: 0.91;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    h1 em {
      color: var(--gold-light);
      font-style: italic;
    }

    .features {
      margin-top: 50px;
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      max-width: 570px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .feature {
      padding: 22px 18px 22px 0;
      border-bottom: 1px solid var(--line);
    }

    .feature:nth-child(odd) {
      border-right: 1px solid var(--line);
    }

    .feature:nth-child(3),
    .feature:nth-child(4) {
      border-bottom: 0;
    }

    .feature:nth-child(even) {
      padding-left: 24px;
    }

    .feature-number {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 0.18em;
    }

    .feature-title {
      color: var(--cream);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .cta-wrap {
      margin-top: 40px;
    }

    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 205px;
      height: 58px;
      padding: 0 30px;
      overflow: hidden;
      color: #0b110e;
      background: var(--cream);
      border: 1px solid var(--cream);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      transition:
        transform 0.3s ease,
        background 0.3s ease,
        color 0.3s ease;
    }

    .cta::after {
      content: "→";
      margin-left: 18px;
      font-size: 17px;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .cta:hover {
      color: var(--cream);
      background: transparent;
      transform: translateY(-2px);
    }

    .cta:hover::after {
      transform: translateX(5px);
    }

    .visual {
      position: relative;
      width: min(46vw, 650px);
      aspect-ratio: 0.88;
      justify-self: end;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 7% 6% 6% 7%;
      border: 1px solid rgba(201, 179, 138, 0.24);
      transform: rotate(-7deg);
    }

    .table {
      position: absolute;
      inset: 10% 7% 8% 9%;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 47%,
          rgba(39, 103, 76, 0.75),
          transparent 57%
        ),
        radial-gradient(
          ellipse at center,
          #153b2d 0%,
          #0c281e 52%,
          #07130f 100%
        );
      border-radius: 50%;
      border: 13px solid #111713;
      box-shadow:
        0 45px 90px rgba(0, 0, 0, 0.58),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 80px rgba(0, 0, 0, 0.6);
      transform: rotate(-8deg);
    }

    .table::before {
      content: "";
      position: absolute;
      inset: 7%;
      border: 1px solid rgba(216, 197, 160, 0.24);
      border-radius: 50%;
    }

    .table::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      top: 50%;
      height: 1px;
      background: rgba(243, 238, 227, 0.07);
      transform: rotate(-1deg);
    }

    .card {
      position: absolute;
      width: 30%;
      aspect-ratio: 0.7;
      border-radius: 5px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.97),
          rgba(230,227,216,0.97)
        );
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.48),
        0 4px 12px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 11px;
      color: #151b18;
      font-family: Georgia, serif;
      z-index: 2;
    }

    .card-one {
      top: 28%;
      left: 25%;
      transform: rotate(-13deg);
    }

    .card-two {
      top: 32%;
      left: 42%;
      transform: rotate(7deg);
    }

    .card-corner {
      font-size: clamp(13px, 1.7vw, 21px);
      line-height: 1;
    }

    .card-suit {
      align-self: center;
      font-size: clamp(38px, 5vw, 65px);
      line-height: 1;
    }

    .chip {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      z-index: 3;
      background:
        radial-gradient(
          circle,
          #18221e 0 30%,
          #c3ae82 31% 34%,
          #18221e 35% 63%,
          #c3ae82 64% 67%,
          #101612 68%
        );
      box-shadow:
        0 18px 28px rgba(0, 0, 0, 0.45),
        inset 0 1px 2px rgba(255,255,255,0.25);
    }

    .chip-one {
      bottom: 25%;
      left: 23%;
      transform: rotate(13deg);
    }

    .chip-two {
      bottom: 18%;
      left: 35%;
      transform: rotate(-18deg);
    }

    .chip-three {
      bottom: 22%;
      left: 48%;
      transform: rotate(8deg);
    }

    .light {
      position: absolute;
      width: 48%;
      height: 35%;
      top: 8%;
      left: 12%;
      background: rgba(236, 222, 192, 0.11);
      filter: blur(35px);
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .footer {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7vw;
      border-top: 1px solid var(--line);
      color: rgba(243, 238, 227, 0.38);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .header {
        padding: 24px 6vw;
      }

      .header-label {
        display: none;
      }

      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 55px;
        padding: 45px 7vw 70px;
      }

      .hero-copy {
        max-width: 680px;
      }

      h1 {
        font-size: clamp(55px, 13vw, 90px);
      }

      .visual {
        width: min(82vw, 560px);
        justify-self: center;
      }

      .footer {
        padding: 20px 7vw;
      }
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 10px;
      }

      .brand-mark {
        width: 23px;
        height: 23px;
      }

      .hero {
        padding-top: 30px;
      }

      .eyebrow {
        margin-bottom: 22px;
        font-size: 8px;
        letter-spacing: 0.24em;
      }

      h1 {
        font-size: clamp(51px, 15vw, 75px);
        line-height: 0.94;
      }

      .features {
        margin-top: 38px;
      }

      .feature {
        padding-top: 17px;
        padding-bottom: 17px;
      }

      .feature-title {
        font-size: 11px;
      }

      .feature:nth-child(even) {
        padding-left: 17px;
      }

      .cta-wrap {
        margin-top: 32px;
      }

      .cta {
        width: 100%;
        height: 56px;
      }

      .visual {
        width: 92vw;
        max-width: 480px;
      }

      .table {
        border-width: 9px;
      }

      .chip {
        width: 45px;
        height: 45px;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
        line-height: 1.6;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .visual {
        animation: float 8s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
    }
  </style>
</head>
